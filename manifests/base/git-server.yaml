apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: flux-substrate
  labels:
    app.kubernetes.io/name: git-server
    app.kubernetes.io/part-of: flux-substrate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: git-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-server
        app.kubernetes.io/part-of: flux-substrate
    spec:
      containers:
        - name: git-server
          image: ko://github.com/gke-demos/flux-substrate/cmd/flux-substrate
          args:
            - --mode=git-server
            - --addr=:8080
            - --repos-dir=/var/lib/flux-git
            - --seed-count=24
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          volumeMounts:
            - name: git-repos
              mountPath: /var/lib/flux-git
      volumes:
        - name: git-repos
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: flux-substrate
  labels:
    app.kubernetes.io/name: git-server
    app.kubernetes.io/part-of: flux-substrate
spec:
  selector:
    app.kubernetes.io/name: dispatcher
  ports:
    - name: http
      port: 80
      targetPort: http
