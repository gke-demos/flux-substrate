apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-substrate-dispatcher
  namespace: flux-substrate
  labels:
    app.kubernetes.io/name: dispatcher
    app.kubernetes.io/part-of: flux-substrate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-substrate-dispatcher
  labels:
    app.kubernetes.io/part-of: flux-substrate
rules:
  - apiGroups: ["source.toolkit.fluxcd.io", "kustomize.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "gitrepositories/status", "kustomizations", "kustomizations/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["", "apps", "autoscaling", "rbac.authorization.k8s.io"]
    resources: ["namespaces", "secrets", "configmaps", "services", "serviceaccounts", "deployments", "horizontalpodautoscalers", "roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-substrate-dispatcher
  labels:
    app.kubernetes.io/part-of: flux-substrate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-substrate-dispatcher
subjects:
  - kind: ServiceAccount
    name: flux-substrate-dispatcher
    namespace: flux-substrate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: flux-substrate
  labels:
    app.kubernetes.io/name: dispatcher
    app.kubernetes.io/part-of: flux-substrate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispatcher
        app.kubernetes.io/part-of: flux-substrate
    spec:
      serviceAccountName: flux-substrate-dispatcher
      securityContext:
        fsGroup: 65532
      containers:
        - name: dispatcher
          image: ko://github.com/gke-demos/flux-substrate/cmd/flux-substrate
          args:
            - --mode=dispatcher
            - --addr=:8080
            - --atespace=flux-substrate
            - --watch-namespace=flux-substrate
            - --data-dir=/var/lib/flux-git
            - --git-base-url=http://git-server.flux-substrate.svc.cluster.local
            - --control-addr=dns:///api.ate-system.svc:443
            - --control-token-file=/run/router-client/ate-api-token
            - --router-url=https://atenet-router.ate-system.svc:443
            - --router-ca-file=/run/router-client/trust-bundle.pem
            - --pod-cert-bundle-file=/run/router-client/credential-bundle.pem
            - --kube-bridge-url=http://kube-bridge.flux-substrate.svc.cluster.local
          env:
            - name: FLUX_SUBSTRATE_ACTOR_IMAGE
              value: ko://github.com/gke-demos/flux-substrate/cmd/flux-substrate
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          volumeMounts:
            - name: router-client
              mountPath: /run/router-client
              readOnly: true
            - name: git-repos
              mountPath: /var/lib/flux-git
      volumes:
        - name: git-repos
          emptyDir: {}
        - name: router-client
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 3600
                  path: ate-api-token
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcher
  namespace: flux-substrate
  labels:
    app.kubernetes.io/name: dispatcher
    app.kubernetes.io/part-of: flux-substrate
spec:
  selector:
    app.kubernetes.io/name: dispatcher
  ports:
    - name: http
      port: 8080
      targetPort: http
