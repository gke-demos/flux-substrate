apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: flux-reconciler-pool
  namespace: flux-substrate
  labels:
    app.kubernetes.io/part-of: flux-substrate
    flux-substrate.io/role: flux-reconciler
spec:
  replicas: 3
  workerImage: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.0
  sandboxClasses:
    - name: gvisor
  template:
    labels:
      flux-substrate.io/role: flux-reconciler
    resources:
      limits:
        cpu: "1500m"
        memory: 1536Mi
      requests:
        cpu: 250m
        memory: 1024Mi
