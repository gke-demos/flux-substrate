apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-oidc-bridge
  namespace: flux-substrate
  labels:
    app.kubernetes.io/name: kube-oidc-bridge
    app.kubernetes.io/part-of: flux-substrate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-substrate-oidc-bridge
  labels:
    app.kubernetes.io/part-of: flux-substrate
rules:
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
    resourceNames:
      - ate:actor:flux-substrate:tenant-01
      - ate:actor:flux-substrate:tenant-02
      - ate:actor:flux-substrate:tenant-03
      - ate:actor:flux-substrate:tenant-04
      - ate:actor:flux-substrate:tenant-05
      - ate:actor:flux-substrate:tenant-06
      - ate:actor:flux-substrate:tenant-07
      - ate:actor:flux-substrate:tenant-08
      - ate:actor:flux-substrate:tenant-09
      - ate:actor:flux-substrate:tenant-10
      - ate:actor:flux-substrate:tenant-11
      - ate:actor:flux-substrate:tenant-12
      - ate:actor:flux-substrate:tenant-13
      - ate:actor:flux-substrate:tenant-14
      - ate:actor:flux-substrate:tenant-15
      - ate:actor:flux-substrate:tenant-16
      - ate:actor:flux-substrate:tenant-17
      - ate:actor:flux-substrate:tenant-18
      - ate:actor:flux-substrate:tenant-19
      - ate:actor:flux-substrate:tenant-20
      - ate:actor:flux-substrate:tenant-21
      - ate:actor:flux-substrate:tenant-22
      - ate:actor:flux-substrate:tenant-23
      - ate:actor:flux-substrate:tenant-24
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-substrate-oidc-bridge
  labels:
    app.kubernetes.io/part-of: flux-substrate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-substrate-oidc-bridge
subjects:
  - kind: ServiceAccount
    name: kube-oidc-bridge
    namespace: flux-substrate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-bridge
  namespace: flux-substrate
  labels:
    app.kubernetes.io/name: kube-bridge
    app.kubernetes.io/part-of: flux-substrate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-bridge
        app.kubernetes.io/part-of: flux-substrate
    spec:
      serviceAccountName: kube-oidc-bridge
      containers:
        - name: kube-bridge
          image: ko://github.com/gke-demos/flux-substrate/cmd/flux-substrate
          args:
            - --mode=oidc-bridge
            - --addr=:8080
            - --atespace=flux-substrate
            - --oidc-issuer-url=https://idp.ate-system.svc
            - --oidc-audience=http://kube-bridge.flux-substrate.svc.cluster.local
            - --oidc-ca-file=/run/servicedns-ca/trust-bundle.pem
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          volumeMounts:
            - name: servicedns-ca
              mountPath: /run/servicedns-ca
              readOnly: true
      volumes:
        - name: servicedns-ca
          projected:
            defaultMode: 0444
            sources:
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: kube-bridge
  namespace: flux-substrate
  labels:
    app.kubernetes.io/name: kube-bridge
    app.kubernetes.io/part-of: flux-substrate
spec:
  selector:
    app.kubernetes.io/name: kube-bridge
  ports:
    - name: http
      port: 80
      targetPort: http
